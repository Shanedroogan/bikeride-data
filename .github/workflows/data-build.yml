name: Data build

# Builds a data set and publishes it to R2 (docs/publish.md, "R2"). Started only by cron-job.org
# through the GitHub API (workflow_dispatch: timetables at 03:15 and 13:00, streets Sundays at
# 05:00, America/New_York), never by `schedule:`, which GitHub may delay or drop.
#
# Guards:
# - The R2 keys live in the Environment r2-publish, restricted to main. Once it exists with that
#   rule, GitHub refuses a job from any other ref at start, dry run or not. It must be created
#   (restricted to main) before the first dispatch: a job that names a missing Environment makes
#   GitHub create it with no rules. The input check below also refuses a real run off main: a
#   second guard should the restriction ever be lifted, not a way to run a branch.
# - The data-bucket names (R2_DATA_ACCESS_KEY_ID, R2_DATA_SECRET_ACCESS_KEY, var R2_DATA_BUCKET)
#   come with the bucket split. Until they are set, a dry run falls back to the repository's
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and var R2_BUCKET, and only reads with them: restore
#   reads, the upload is skipped, and publish, prune, aux and GC print their plans. With no data/
#   in that bucket the run is a first run (M4 I1). A real run never falls back: that key can also
#   write and delete the bucket's history. A half-set pair (a key without its bucket) fails at
#   the first read with a 403.
# - Inputs reach the scripts only through env:, never spliced into a run: line.
# - Each R2 step gets the keys in its own env:; the checkout, the Swift build and the set build
#   never see them.
# - Flows never reaches this runner (docs/publish.md, "R2"): every build skips flows and carries
#   it from the previous set; restore-state.sh and build-set.sh fail if a flows.bin is present,
#   and publish-set.sh --no-flows-upload refuses a set whose flows was built here.
# - No upload-artifact, no set -x, and a cache of .build only: logs, artifacts and caches of a
#   public repository are public.
#
# A first run (no data/manifest.json in R2) is built only as a dry run: without --previous and
# --require-flows, publishing nothing (M4 I1). A real first run stops at the restore: the first
# set is published from the Mac (scripts/publish-local.sh --first).
on:
  workflow_dispatch:
    inputs:
      job:
        description: "timetables (twice daily), streets (Sundays), or gc (garbage collection only)"
        type: choice
        options: [timetables, streets, gc]
        required: true
        default: timetables
      dry_run:
        description: "Build and print the publish plan; write nothing to R2 (cron-job.org passes false)"
        type: boolean
        default: true
      accept_trip_count_change:
        description: "Systems whose reviewed trip-count change the gate accepts, e.g. subway,path (empty: none)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

# One publisher at a time. A third dispatch while one runs and one waits replaces the waiting
# one: acceptable, the slots are 10 h apart.
concurrency:
  group: data-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  data-build:
    name: ${{ inputs.job }}${{ inputs.dry_run && ' (dry run)' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: r2-publish
    # swift:6.4-noble pinned by digest (the multi-arch index, read from Docker Hub 2026-10-01).
    # To bump: docker buildx imagetools inspect swift:6.4-noble, take the index digest, re-pin.
    container:
      image: swift:6.4-noble@sha256:64bab762bc73a3fda6d9ebc559258bd6d7660c10a705bb25ecacad2f99d066f9
    env:
      TZ: UTC
      # Pinned AWS CLI build, as the private repository's nightly.yml: the sha256 was taken
      # 2026-09-26 from the zip whose PGP signature verified against the AWS CLI Team key
      # FB5D B77F D5C1 18B8 0511 ADA8 A631 0ACC 4672 475C.
      AWSCLI_VERSION: "2.27.0"
      AWSCLI_SHA256: "13b4a15795b818ef837464f40e0902bfca7ce785597fd53e6d2ecbc2598d9a38"
      INPUT_JOB: ${{ inputs.job }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_ACCEPT_TRIP_COUNT_CHANGE: ${{ inputs.accept_trip_count_change }}
    steps:
      # First, before anything is installed: a bad input fails in seconds, and a bogus
      # accept_trip_count_change is the cheap way to check that a failed run sends its email.
      - name: Check the inputs
        id: check
        run: |
          case $INPUT_JOB in
            timetables | streets | gc) ;;
            *) echo "::error::job must be timetables, streets or gc"; exit 1 ;;
          esac
          case $INPUT_DRY_RUN in
            true | false) ;;
            *) echo "::error::dry_run must be true or false"; exit 1 ;;
          esac
          systems='(subway|bus|lirr|ferry|path)'
          if [ -n "$INPUT_ACCEPT_TRIP_COUNT_CHANGE" ]; then
            if ! [[ $INPUT_ACCEPT_TRIP_COUNT_CHANGE =~ ^$systems(,$systems)*$ ]]; then
              echo "::error::accept_trip_count_change must be systems from subway, bus, lirr, ferry, path, comma-separated, no spaces"
              exit 1
            fi
            if [ "$INPUT_JOB" = gc ]; then
              echo "::error::accept_trip_count_change applies to a build; job gc builds nothing"
              exit 1
            fi
          fi
          if [ "$INPUT_DRY_RUN" != true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::only main runs this workflow (the r2-publish Environment allows no other ref)"
            exit 1
          fi
          {
            echo "### Data build: $INPUT_JOB$([ "$INPUT_DRY_RUN" = true ] && echo ' (dry run)')"
            echo
            echo "- commit: $GITHUB_SHA"
            if [ -n "$INPUT_ACCEPT_TRIP_COUNT_CHANGE" ]; then
              echo "- accepted trip-count change: $INPUT_ACCEPT_TRIP_COUNT_CHANGE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The CLI's tools and jq (apt-packages.txt), curl for the downloads, tzdata for
      # America/New_York. The container runs as root and the workspace belongs to the runner
      # user: without safe.directory git refuses the repository (as the private nightly.yml).
      - name: System tools
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update -qq
          # shellcheck disable=SC2046 # one package per word
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            $(grep -v '^#' apt-packages.txt) curl ca-certificates tzdata

      - name: Install AWS CLI v2 (${{ env.AWSCLI_VERSION }})
        run: |
          zip="$RUNNER_TEMP/awscliv2.zip"
          curl -fsSL -o "$zip" "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${AWSCLI_VERSION}.zip"
          echo "$AWSCLI_SHA256  $zip" | sha256sum -c -
          unzip -q "$zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/aws/install" --install-dir "$RUNNER_TEMP/aws-cli" --bin-dir "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/aws" --version

      - name: Toolchain version
        id: toolchain
        if: inputs.job != 'gc'
        run: echo "id=$(swift --version 2>&1 | head -n 1 | sha256sum | cut -c 1-16)" >> "$GITHUB_OUTPUT"

      # .build only: no data, sources, reports or trip data are ever cached (a public
      # repository's caches can be read by its forks' pull requests). Everything this job
      # downloads or builds lives under build/, outside the cached path.
      - name: Cache .build
        if: inputs.job != 'gc'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build
          key: data-build-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Sources/**', 'Package.swift', 'Package.resolved') }}
          restore-keys: |
            data-build-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-

      # Retried: SwiftPM 6.4's planner sometimes segfaults while planning on Linux (exit 139,
      # before any compile; the private repository's run 36273854387). No R2 keys in this step.
      - name: Build bikeride-data
        if: inputs.job != 'gc'
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            if swift build -c release --product bikeride-data; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "::warning::swift build failed (attempt $attempt); retrying"
          done
          echo "BIKERIDE_DATA=$(swift build -c release --show-bin-path)/bikeride-data" >> "$GITHUB_ENV"

      # The hold, the previous set, the source archive and (timetables) streets and stations.
      # A first run is allowed only on a dry run. state.env is read with sed and checked, never
      # sourced: PREV_SET comes from the manifest in R2, and this step holds the keys.
      - name: Restore the previous set and the sources
        id: restore
        if: inputs.job != 'gc'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_DATA_ACCESS_KEY_ID || (inputs.dry_run && secrets.R2_ACCESS_KEY_ID) || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_DATA_SECRET_ACCESS_KEY || (inputs.dry_run && secrets.R2_SECRET_ACCESS_KEY) || '' }}
          R2_BUCKET: ${{ vars.R2_DATA_BUCKET || (inputs.dry_run && vars.R2_BUCKET) || '' }}
        run: |
          args=(--job "$INPUT_JOB" --prev build/prev --sources build/sources --data build/data)
          if [ "$INPUT_DRY_RUN" = true ]; then args+=(--allow-first-run); fi
          scripts/restore-state.sh "${args[@]}"
          state_value() { sed -n "s/^$1=//p" build/prev/state.env | tail -n 1; }
          HOLD=$(state_value HOLD)
          FIRST_RUN=$(state_value FIRST_RUN)
          BUILD_DAY=$(state_value BUILD_DAY)
          if ! [[ $HOLD =~ ^[01]$ && $FIRST_RUN =~ ^[01]$ && $BUILD_DAY =~ ^[0-9]{8}$ ]]; then
            echo "::error::build/prev/state.env: HOLD, FIRST_RUN or BUILD_DAY is unreadable"
            exit 1
          fi
          {
            echo "hold=$HOLD"
            echo "first_run=$FIRST_RUN"
            echo "build_day=$BUILD_DAY"
          } >> "$GITHUB_OUTPUT"

      # streets: the street graph on its own first, so a failed build or a failed sanity route
      # (exit 2, which `all` takes as a warning) is seen here. Never fails the step: the
      # fallback below takes over, and the job fails at the end.
      # Under timeout, which signals the whole process group (curl, osmium): a stalled Geofabrik
      # download or osmium ends here with ok=0. A step timeout would only stop the docker exec,
      # and could leave the build writing build/data while the fallback restores into it.
      # timeout-minutes and continue-on-error are the backstop should the step end some other
      # way; "Streets result" then reads it as not rebuilt.
      - name: Build streets
        id: streets
        if: inputs.job == 'streets' && steps.restore.outputs.hold == '0'
        timeout-minutes: 25
        continue-on-error: true
        run: |
          status=0
          timeout --kill-after=60 22m "$BIKERIDE_DATA" streets --sources build/sources --out build/data || status=$?
          if [ "$status" = 0 ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            case $status in
              124) echo "::warning::streets timed out after 22 min; publishing the timetables on the published streets and stations" ;;
              137) echo "::warning::streets was killed (past its timeout, or out of memory); publishing the timetables on the published streets and stations" ;;
              *) echo "::warning::streets stopped with status $status (2: a sanity route failed); publishing the timetables on the published streets and stations" ;;
            esac
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi

      # The one streets verdict every later step reads: rebuilt only when the step succeeded and
      # said so.
      - name: Streets result
        id: streets_result
        if: inputs.job == 'streets' && steps.restore.outputs.hold == '0'
        env:
          OUTCOME: ${{ steps.streets.outcome }}
          OK: ${{ steps.streets.outputs.ok }}
        run: |
          if [ "$OUTCOME" = success ] && [ "$OK" = 1 ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            if [ "$OK" != 0 ]; then echo "::warning::the streets step ended $OUTCOME with no verdict; taking it as not rebuilt"; fi
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the published streets and stations (fallback)
        if: steps.streets_result.outputs.ok == '0'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_DATA_ACCESS_KEY_ID || (inputs.dry_run && secrets.R2_ACCESS_KEY_ID) || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_DATA_SECRET_ACCESS_KEY || (inputs.dry_run && secrets.R2_SECRET_ACCESS_KEY) || '' }}
          R2_BUCKET: ${{ vars.R2_DATA_BUCKET || (inputs.dry_run && vars.R2_BUCKET) || '' }}
        run: scripts/restore-state.sh --blobs-only --prev build/prev --data build/data

      # No R2 keys: bikeride-data downloads only public sources.
      - name: Build the set
        id: build
        if: inputs.job != 'gc' && steps.restore.outputs.hold == '0'
        timeout-minutes: 30
        env:
          STREETS_OK: ${{ steps.streets_result.outputs.ok }}
        run: |
          job=$INPUT_JOB
          if [ "$STREETS_OK" = 0 ]; then job=streets-restored; fi
          args=(--job "$job" --prev build/prev --data build/data --sources build/sources)
          if [ "$INPUT_DRY_RUN" = true ]; then args+=(--dry-run); fi
          if [ -n "$INPUT_ACCEPT_TRIP_COUNT_CHANGE" ]; then
            args+=(--accept-trip-count-change "$INPUT_ACCEPT_TRIP_COUNT_CHANGE")
          fi
          scripts/build-set.sh "${args[@]}"

      # Add-only, and also after a failed build: a source version first seen by a run that then
      # failed is kept. Real runs only.
      - name: Upload new source versions (add-only)
        if: always() && inputs.job != 'gc' && !inputs.dry_run && steps.restore.outcome == 'success' && steps.restore.outputs.hold == '0'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_DATA_ACCESS_KEY_ID || (inputs.dry_run && secrets.R2_ACCESS_KEY_ID) || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_DATA_SECRET_ACCESS_KEY || (inputs.dry_run && secrets.R2_SECRET_ACCESS_KEY) || '' }}
          R2_BUCKET: ${{ vars.R2_DATA_BUCKET || (inputs.dry_run && vars.R2_BUCKET) || '' }}
        run: scripts/sync-sources.sh upload --sources build/sources

      # Only on the build: a failed source upload above turns the run red but does not hold back
      # the set (the archive is a backup; the next run uploads what this one could not).
      # published=1 when the set went out (on a dry run: would have), 0 when a hold that began
      # after the restore stopped it.
      - name: Publish the set
        id: publish
        if: ${{ !cancelled() && inputs.job != 'gc' && steps.restore.outputs.hold == '0' && steps.build.outcome == 'success' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_DATA_ACCESS_KEY_ID || (inputs.dry_run && secrets.R2_ACCESS_KEY_ID) || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_DATA_SECRET_ACCESS_KEY || (inputs.dry_run && secrets.R2_SECRET_ACCESS_KEY) || '' }}
          R2_BUCKET: ${{ vars.R2_DATA_BUCKET || (inputs.dry_run && vars.R2_BUCKET) || '' }}
        run: |
          args=(--data build/data --prev build/prev --no-flows-upload --result-file "$GITHUB_OUTPUT")
          if [ "$INPUT_DRY_RUN" = true ]; then args+=(--dry-run); fi
          scripts/publish-set.sh "${args[@]}"

      # Deletions, and the last good copy of the auxiliary files, only after a set was published
      # (not when a hold stopped it). The borough boundaries only when streets was rebuilt on them.
      - name: Prune source versions and keep the auxiliary files
        if: ${{ !cancelled() && inputs.job != 'gc' && steps.publish.outcome == 'success' && steps.publish.outputs.published == '1' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_DATA_ACCESS_KEY_ID || (inputs.dry_run && secrets.R2_ACCESS_KEY_ID) || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_DATA_SECRET_ACCESS_KEY || (inputs.dry_run && secrets.R2_SECRET_ACCESS_KEY) || '' }}
          R2_BUCKET: ${{ vars.R2_DATA_BUCKET || (inputs.dry_run && vars.R2_BUCKET) || '' }}
          BUILD_DAY: ${{ steps.restore.outputs.build_day }}
          STREETS_OK: ${{ steps.streets_result.outputs.ok }}
        run: |
          dry=()
          if [ "$INPUT_DRY_RUN" = true ]; then dry=(--dry-run); fi
          scripts/sync-sources.sh prune --sources build/sources --restored build/prev/sources-restored.txt \
            --today "$BUILD_DAY" "${dry[@]}"
          files=entrances
          if [ "$STREETS_OK" = 1 ]; then files=entrances,boundaries; fi
          scripts/sync-sources.sh aux --sources build/sources --files "$files" "${dry[@]}"

      - name: Garbage-collect data/
        if: ${{ !cancelled() && ((inputs.job == 'gc' && success()) || (steps.publish.outcome == 'success' && steps.publish.outputs.published == '1')) }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_DATA_ACCESS_KEY_ID || (inputs.dry_run && secrets.R2_ACCESS_KEY_ID) || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_DATA_SECRET_ACCESS_KEY || (inputs.dry_run && secrets.R2_SECRET_ACCESS_KEY) || '' }}
          R2_BUCKET: ${{ vars.R2_DATA_BUCKET || (inputs.dry_run && vars.R2_BUCKET) || '' }}
        run: |
          args=()
          if [ "$INPUT_DRY_RUN" = true ]; then args+=(--dry-run); fi
          scripts/gc-data.sh "${args[@]}"

      # The set as built: setIds, xz sizes, coverage, gate checks and where flows came from
      # (scripts/set-summary.sh, from the checked manifest; no key outside data/ and sources/).
      - name: Summary
        if: always() && inputs.job != 'gc'
        env:
          HOLD: ${{ steps.restore.outputs.hold }}
          FIRST_RUN: ${{ steps.restore.outputs.first_run }}
          STREETS_OK: ${{ steps.streets_result.outputs.ok }}
          PUBLISH: ${{ steps.publish.outcome }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          {
            if [ "$HOLD" = 1 ]; then echo "- on hold: nothing was built or published"; fi
            if [ "$FIRST_RUN" = 1 ]; then
              echo "- first run (no set in R2): built without --previous and --require-flows; nothing was published"
            fi
            if [ "$STREETS_OK" = 0 ]; then
              echo "- **streets not rebuilt**: the timetables were published on the published streets and stations"
            fi
            if [ "$PUBLISHED" = 0 ]; then
              echo "- on hold since the restore: the set was not published, and nothing was pruned or collected"
            fi
            if [ -f build/data/manifest.json ]; then
              echo "- publish step: ${PUBLISH:-not run}"
              echo
              scripts/set-summary.sh build/data/manifest.json || echo "(the manifest could not be summarised)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Last, after the timetables were published on the old streets: the run is red, and the
      # failed-run email says why.
      - name: Streets not rebuilt
        if: always() && steps.streets_result.outputs.ok == '0'
        run: |
          echo "::error::streets not rebuilt (its build or a sanity route failed); see the Build streets step"
          exit 1
